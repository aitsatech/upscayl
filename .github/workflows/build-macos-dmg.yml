name: Build macOS DMG (Catalina-compatible)

# Triggers: push a tag like "v1.0.0-catalina" to build a release DMG,
# or run manually from the Actions tab.
on:
  push:
    tags:
      - "*-catalina"
  workflow_dispatch: {}

jobs:
  build-dmg:
    runs-on: macos-13   # Intel runner; use macos-14 if you need Apple Silicon builds
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin Electron to last Catalina-compatible version
        run: npm install --save-dev electron@32.2.7

      - name: Install dependencies
        run: npm ci

      - name: Build renderer/app
        run: npm run build

      - name: Package DMG (unsigned, Catalina minimum)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # skip code signing (no Apple Developer cert needed)
        run: npx electron-builder --mac dmg --x64 --publish never
          --config.mac.minimumSystemVersion=10.15.0

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: upscayl-catalina-dmg
          path: dist/*.dmg

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
